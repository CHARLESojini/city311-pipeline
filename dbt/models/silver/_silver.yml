version: 2

models:
  - name: slv_nyc_requests
    description: Latest version of each NYC request in the conformed column set.

  - name: slv_boston_requests
    description: >
      Boston as one continuous history across the CRM migration: the legacy and
      new systems deduped separately and stacked, with source_system kept.

  - name: slv_service_requests
    description: All cities and source systems in one conformed schema, one row per request.
    columns:
      - name: request_key
        description: "<source_system>:<request_id>, unique across every city and system."
      - name: city
        description: NYC or Boston.
      - name: source_system
        description: nyc, boston_legacy or boston_new.
      - name: status_group
        description: open / closed / other, normalized from each system's statuses.
      - name: standard_category
        description: Cross-city category from the category_map seed; 'Other' when unmapped.
      - name: channel
        description: phone / web_app / employee / email / unknown, from the channel_map seed.
      - name: is_on_time
        description: Boston only (ONTIME/OVERDUE against the city's own target); NULL for NYC.
      - name: has_invalid_closure
        description: True when the source closed the request before it was created.
      - name: resolution_hours
        description: Hours from creation to close; NULL when open or the closure is invalid.

seeds:
  - name: category_map
    description: >
      Maps each system's own category (NYC complaint_type, Boston legacy type,
      Boston new service_name) to a shared standard_category so cities compare.
  - name: channel_map
    description: Maps each system's intake channel to a shared channel value.
