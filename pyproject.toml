[project]
name = "city311-pipeline"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["airflow/.astro", "airflow/tests/dags/test_dag_example.py", "dbt/target", "dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["include"]

[tool.pytest.ini_options]
testpaths = ["airflow/tests/unit"]
